<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title mb-4 text-primary">
        <i class="bi bi-envelope-paper-fill"></i> Déposer une réclamation
      </h2>

      <form [formGroup]="tickeForm">

        <div class="mb-3">
          <label class="form-label">
            <i class="bi bi-mic-fill"></i> Note vocale (optionnel)
          </label>
          <input type="file" class="form-control" (change)="onAudioSelected($event)" accept="audio/*">
        </div>

        <div class="mb-3">
          <label class="form-label">
            <i class="bi bi-paperclip"></i> Photo du produit (optionnel)
          </label>
          <input type="file" class="form-control" (change)="onImageSelected($event)" accept="image/*">
        </div>

        <div class="mb-3">
          <label class="form-label">
            <i class="bi bi-pencil-square"></i> Description (optionnel)
          </label>
          <textarea class="form-control" rows="4" formControlName="text" placeholder="Décrivez votre problème..."></textarea>
        </div>
        <div class="text-center mb-3" *ngIf="isLoading">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Chargement...</span>
  </div>
  <p class="mt-2">Analyse en cours...</p>
</div>

        <button type="button" class="btn btn-primary w-100" (click)="onSubmit()" [disabled]="isLoading">
          <i class="bi bi-send-fill"></i> Envoyer la réclamation
        </button>

        <app-ticket-result [result]="ticketResult"></app-ticket-result>

      </form>
    </div>
  </div>
</div>
